<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4433" />
  <title>Buat Kata Sandi Baru | TPQ Darul Jinan</title>
  <script src="darussolah-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" integrity="sha384-AkNSQdptcXlJ0/NBZc4qGk86cDVXcCevwoWgEKIpHOEfbvlXGLlIkimQtONt8KNf" crossorigin="anonymous"></script>
  <style>
    :root { color-scheme: light; --pine: #0d4433; --deep: #082e25; --cream: #f8f6f0; --paper: #fffdf9; --ink: #1d2924; --muted: #68726d; --line: #dfe1d9; --gold: #e8c879; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 24px; color: var(--ink); background: var(--cream); font: 14px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 20px 50px rgba(8,46,37,.09); }
    h1 { margin: 0 0 10px; color: var(--deep); font: 400 34px/1.05 Georgia, serif; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
    label { display: grid; gap: 8px; margin-bottom: 16px; color: var(--deep); font-size: 12px; font-weight: 700; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
    input:focus { outline: 3px solid rgba(13,68,51,.12); border-color: var(--pine); }
    button, a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none; }
    button { width: 100%; color: #fff; border: 0; background: var(--pine); cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    a { margin-top: 14px; color: var(--pine); }
    [role="status"] { display: none; margin-top: 18px; padding: 12px; border-radius: 9px; background: #edf6e9; color: #486148; font-size: 12px; }
    [role="status"].show { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Buat kata sandi baru</h1>
    <p>Gunakan kata sandi unik dan panjang untuk akun Anda. Tautan pemulihan hanya berlaku sementara.</p>
    <form id="reset-form">
      <label for="password">Kata sandi baru<input id="password" type="password" minlength="10" autocomplete="new-password" required /></label>
      <label for="password-confirm">Ulangi kata sandi<input id="password-confirm" type="password" minlength="10" autocomplete="new-password" required /></label>
      <button type="submit">Simpan kata sandi</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <a href="login.html">Kembali ke login</a>
  </main>
  <script>
    (() => {
      const config = window.DARUSSOLAH_CONFIG || {};
      const status = document.querySelector('#status');
      const form = document.querySelector('#reset-form');
      const show = message => { status.textContent = message; status.classList.add('show'); };
      const url = String(config.supabaseUrl || '').replace(/\/+$/, '');
      const key = String(config.supabaseAnonKey || '');
      if (!url || !key || !window.supabase) { form.hidden = true; show('Layanan pemulihan belum dikonfigurasi. Hubungi admin.'); return; }
      const client = window.supabase.createClient(url, key, { auth: { persistSession: true, storage: window.localStorage } });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const password = document.querySelector('#password').value;
        const confirmation = document.querySelector('#password-confirm').value;
        if (password !== confirmation) { show('Kata sandi belum sama.'); return; }
        const button = form.querySelector('button');
        button.disabled = true;
        const { error } = await client.auth.updateUser({ password });
        if (error) { button.disabled = false; show(error.message || 'Kata sandi belum dapat diperbarui.'); return; }
        await client.auth.signOut();
        form.hidden = true;
        show('Kata sandi berhasil diperbarui. Silakan masuk kembali.');
      });
    })();
  </script>
</body>
</html>
